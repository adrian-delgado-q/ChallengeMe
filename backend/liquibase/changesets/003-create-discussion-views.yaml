databaseChangeLog:
  - changeSet:
      id: 3
      author: gemini
      changes:
        - createView:
            viewName: discussion_post_details_view
            replaceIfExists: true
            selectQuery: |
              SELECT
                  dp.id,
                  dp."challengeId",
                  dp."authorId",
                  dp.content,
                  dp."createdAt",
                  dp."updatedAt",
                  dp."isPinned",
                  dp."isDeleted",
                  dp."replyCount",
                  dp."lastReplyAt",
                  p.username AS author_username,
                  p.avatar_url AS author_avatar_url
              FROM
                  discussion_posts dp
              JOIN
                  profiles p ON dp."authorId" = p.id
        - createView:
            viewName: discussion_reply_details_view
            replaceIfExists: true
            selectQuery: |
              SELECT
                  dr.id,
                  dr."postId",
                  dr."parentId",
                  dr."authorId",
                  dr.content,
                  dr."createdAt",
                  dr."updatedAt",
                  dr."isDeleted",
                  p.username AS author_username,
                  p.avatar_url AS author_avatar_url
              FROM
                  discussion_replies dr
              JOIN
                  profiles p ON dr."authorId" = p.id
      rollback:
        - dropView:
            viewName: discussion_post_details_view
        - dropView:
            viewName: discussion_reply_details_view
