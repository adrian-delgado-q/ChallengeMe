databaseChangeLog:
  - changeSet:
      id: 5
      author: gemini
      changes:
        - createView:
            viewName: team_details_view
            replaceIfExists: true
            selectQuery: |
              SELECT
                  t.id,
                  t.name,
                  t.description,
                  t."avatarUrl",
                  t."isPublic",
                  t."maxMembers",
                  t."creatorId",
                  p.username AS creator_username,
                  p.avatar_url AS creator_avatar_url,
                  (SELECT COUNT(*) FROM "TeamMembership" tm WHERE tm."teamId" = t.id) AS member_count
              FROM
                  "Team" t
              JOIN
                  "profiles" p ON t."creatorId" = p.id
      rollback:
        - dropView:
            viewName: team_details_view
