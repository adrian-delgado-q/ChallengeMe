databaseChangeLog:
  - changeSet:
      id: 2
      author: gemini
      changes:
        - createView:
            viewName: challenge_details_view
            replaceIfExists: true
            selectQuery: |
              SELECT
                  c.id,
                  c.title,
                  c.description,
                  c."imageUrl",
                  c."challengeType",
                  c."maxParticipants",
                  c."maxTeamSize",
                  c."startDate",
                  c."endDate",
                  c."isPublic",
                  c."creatorId",
                  p.username AS creator_username,
                  p.avatar_url AS creator_avatar_url,
                  (SELECT COUNT(*) FROM "ChallengeParticipant" cp WHERE cp."challengeId" = c.id) AS participant_count
              FROM
                  "Challenge" c
              JOIN
                  "profiles" p ON c."creatorId" = p.id
      rollback:
        - dropView:
            viewName: challenge_details_view
