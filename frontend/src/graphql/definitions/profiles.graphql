# src/graphql/definitions/profiles.graphql

# Fragments

fragment ProfileBasic on Profile {
    id
    username
    avatar_url
    created_at
    updated_at
}

fragment ProfileFields on Profile {
    ...ProfileBasic
    # Notification relations
    notifications(limit: 10, offset: 0) {
      ...NotificationFields
    }
    notification_preference {
      ...NotificationPreferenceFields
    }
    # push_subscriptions are likely not needed on the main profile query

    # Workout ecosystem relations
    created_programs {
      id
      name
      image_url
      visibility
    }
    followers {
      id
      follower {
        id
        username
        avatar_url
      }
    }
    following {
      id
      following {
        id
        username
        avatar_url
      }
    }
}

# Queries

query GetProfile($id: String!) {
    profile(id: $id) {
        ...ProfileFields
    }
}

query GetProfiles {
    profiles {
        ...ProfileBasic
    }
}


# Mutations

mutation UpdateProfile(
    $id: String!
    $username: String
    $avatar_url: String
) {
    updateProfile(
        id: $id
        username: $username
        avatar_url: $avatar_url
    ) {
        ...ProfileBasic
    }
}