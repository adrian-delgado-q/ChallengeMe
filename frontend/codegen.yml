$schema: "https://the-guild.dev/graphql/codegen/config.schema.json"

schema: "http://${GRAPHQL_HTTP_HOST}:${GRAPHQL_HTTP_PORT}/graphql"
documents: "src/graphql/**/*.graphql.ts" # Now we have GraphQL documents

generates:
  ./src/generated/graphql.ts:
    plugins:
      - typescript
      - typescript-operations # Now we can generate operations
      - typescript-graphql-request # Now we can generate graphql-request types
    config:
      namingConvention:
        transformUnderscore: true
      skipTypename: false
      enumsAsTypes: true
      avoidOptionals: false
      maybeValue: T | null
